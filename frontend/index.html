<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>如意 · 后台管理系统</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ============================================
       如意国风科技蓝 v2 · Modern Tech Theme
       Glassmorphism + 3D + Dynamic Gradients
       ============================================ */
    :root {
      --bg-deep:    #060B18;
      --accent:     #4DABF7;
      --cyan:       #22B8CF;
      --gold:       #D4A853;
      --gold-lt:    #F0D68A;
      --purple:     #7950F2;

      --glass-bg:      rgba(255,255,255,0.03);
      --glass-border:  rgba(255,255,255,0.08);
      --glass-hover:   rgba(255,255,255,0.06);
      --glass-blur:    16px;

      --glow-blue:   0 0 20px rgba(77,171,247,0.3), 0 0 60px rgba(77,171,247,0.1);
      --glow-cyan:   0 0 20px rgba(34,184,207,0.3), 0 0 60px rgba(34,184,207,0.1);
      --glow-gold:   0 0 20px rgba(212,168,83,0.3), 0 0 60px rgba(212,168,83,0.1);

      --text-primary:   #E8ECF1;
      --text-secondary: #8892A4;
      --text-muted:     #5A6478;

      --header-h: 60px;
      --sidebar-w: 220px;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body, #root {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background: var(--bg-deep);
    }

    /* ===== Background Layer ===== */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(77,171,247,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35;
      animation: orbFloat 14s ease-in-out infinite;
    }
    .bg-orb.orb1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--accent), transparent);
      top: -10%; left: -5%;
    }
    .bg-orb.orb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--purple), transparent);
      bottom: -10%; right: -5%; animation-delay: -5s;
    }
    .bg-orb.orb3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, var(--cyan), transparent);
      top: 60%; left: 40%; animation-delay: -9s;
    }
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      25%     { transform: translate(40px,-30px) scale(1.1); }
      50%     { transform: translate(-20px,20px) scale(0.95); }
      75%     { transform: translate(-35px,-15px) scale(1.05); }
    }

    /* ===== Layout ===== */
    .layout { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    /* ===== Header ===== */
    .header {
      height: var(--header-h); min-height: var(--header-h);
      display: flex; align-items: center; padding: 0 24px; z-index: 100;
      background: rgba(12,22,45,0.65);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent, var(--gold) 15%, var(--accent) 35%,
        var(--cyan) 55%, var(--purple) 75%, var(--gold) 85%, transparent);
      box-shadow: 0 0 8px rgba(77,171,247,0.4);
    }
    .header .logo-area { display: flex; align-items: center; gap: 10px; width: var(--sidebar-w); flex-shrink: 0; }
    .header .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 16px;
      box-shadow: var(--glow-blue);
    }
    .header .logo-text {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .header-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
    .header .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--purple));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; font-size: 14px;
      box-shadow: var(--glow-gold);
    }

    /* ===== Body ===== */
    .body { flex: 1; display: flex; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100%;
      background: rgba(8,16,35,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      padding: 12px 0; overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .sidebar .menu-group-title {
      color: var(--text-muted); font-size: 10px;
      padding: 18px 20px 6px; letter-spacing: 3px;
      text-transform: uppercase; font-weight: 600;
    }
    .sidebar .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; margin: 2px 8px;
      color: var(--text-secondary); font-size: 13px;
      border-radius: 8px; cursor: pointer;
      transition: all 0.25s var(--ease-out);
      border: none; background: none; position: relative;
    }
    .sidebar .menu-item:hover { color: #fff; background: var(--glass-hover); }
    .sidebar .menu-item.active {
      color: var(--accent); background: rgba(77,171,247,0.1);
      font-weight: 600; box-shadow: inset 0 0 0 1px rgba(77,171,247,0.2);
    }
    .sidebar .menu-item.active::before {
      content: '';
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 18px;
      background: var(--accent); border-radius: 0 3px 3px 0;
      box-shadow: 0 0 8px var(--accent);
    }
    .sidebar .menu-icon { font-size: 17px; width: 24px; text-align: center; }

    /* ===== Content ===== */
    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 28px 28px 40px;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    /* ===== Page Title ===== */
    .page-title {
      font-size: 24px; font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }

    /* ===== Stat Cards ===== */
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 22px 24px;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
      transition: all 0.4s var(--ease-out);
    }
    .stat-card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.05);
      border-color: rgba(77,171,247,0.25);
      box-shadow: var(--glow-blue);
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }
    .stat-card .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
    .stat-card .stat-value {
      font-size: 30px; font-weight: 800; color: var(--text-primary);
      text-shadow: 0 0 20px rgba(77,171,247,0.2);
    }
    .stat-card .stat-change { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .stat-card .stat-change.up { color: #51CF66; }
    .stat-card .stat-change.down { color: #FF6B6B; }
    .stat-icon-wrap {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff;
    }
    .stat-icon-wrap.blue   { background: linear-gradient(135deg, #339AF0, #4DABF7); box-shadow: var(--glow-blue); }
    .stat-icon-wrap.cyan   { background: linear-gradient(135deg, #20C997, #22B8CF); box-shadow: var(--glow-cyan); }
    .stat-icon-wrap.gold   { background: linear-gradient(135deg, #D4A853, #F0D68A); box-shadow: var(--glow-gold); }
    .stat-icon-wrap.purple { background: linear-gradient(135deg, #7950F2, #9775FA); }

    /* ===== Panel ===== */
    .panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 24px;
      position: relative; overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .panel:hover {
      border-color: rgba(77,171,247,0.15);
      box-shadow: 0 0 30px rgba(77,171,247,0.05);
    }
    .panel::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 3px; height: 36px;
      background: linear-gradient(180deg, var(--accent), var(--cyan));
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px rgba(77,171,247,0.3);
    }
    .panel h3 {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 18px; padding-bottom: 14px; padding-left: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    /* ===== Chart ===== */
    .chart-bars { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding: 0 12px; }
    .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .chart-bar-outer {
      width: 100%; max-width: 44px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px 8px 0 0;
      position: relative; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.3);
    }
    .chart-bar-inner {
      width: 100%; border-radius: 8px 8px 0 0;
      position: absolute; bottom: 0;
      background: linear-gradient(180deg,
        rgba(77,171,247,1) 0%,
        rgba(34,184,207,0.8) 50%,
        rgba(121,80,242,0.6) 100%
      );
      box-shadow: 0 0 12px rgba(77,171,247,0.3);
      transition: height 0.8s var(--ease-spring);
    }
    .chart-bar-inner::after {
      content: '';
      position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
      width: 60%; height: 2px;
      background: rgba(255,255,255,0.5); border-radius: 1px;
    }
    .chart-bar-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* ===== Table ===== */
    .dash-table { width: 100%; border-collapse: collapse; }
    .dash-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      color: var(--text-muted); padding: 10px 14px;
      border-bottom: 1px solid var(--glass-border);
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .dash-table td {
      font-size: 13px; padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-secondary); transition: background 0.2s;
    }
    .dash-table tr:hover td { background: rgba(77,171,247,0.04); }
    .dash-table .order-id { color: var(--accent); font-weight: 500; font-family: "SF Mono", monospace; }

    /* ===== Badge ===== */
    .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.3px; }
    .badge.success { background: rgba(64,192,87,0.12); color: #69DB7C; border: 1px solid rgba(64,192,87,0.2); }
    .badge.info    { background: rgba(77,171,247,0.12); color: #4DABF7; border: 1px solid rgba(77,171,247,0.2); }
    .badge.warning { background: rgba(255,146,43,0.12); color: #FFA94D; border: 1px solid rgba(255,146,43,0.2); }

    /* ===== Quick Actions ===== */
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .qa-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 15px 18px; border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.02);
      cursor: pointer; font-size: 13px; color: var(--text-secondary);
      transition: all 0.3s var(--ease-out);
    }
    .qa-btn:hover {
      border-color: rgba(77,171,247,0.3);
      background: rgba(77,171,247,0.06);
      color: var(--accent); transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(77,171,247,0.1);
    }

    /* ===== Notification Dots ===== */
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
    .dot.blue   { background: var(--accent);  box-shadow: 0 0 6px var(--accent); }
    .dot.gold   { background: var(--gold);    box-shadow: 0 0 6px var(--gold); }
    .dot.green  { background: #69DB7C;        box-shadow: 0 0 6px #69DB7C; }
    .dot.purple { background: var(--purple);  box-shadow: 0 0 6px var(--purple); }

    /* ===== Content Columns ===== */
    .content-cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }


    /* ===== Expert Enhancement: @property Animated Glow Border ===== */
    @property --card-glow-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    /* Animated glow border on stat cards (replaces static ::after) */
    .stat-card.glow-animated {
      border: 1px solid transparent;
      background:
        linear-gradient(var(--glass-bg), var(--glass-bg)) padding-box,
        conic-gradient(
          from var(--card-glow-angle),
          transparent,
          var(--accent),
          var(--cyan),
          var(--purple),
          transparent
        ) border-box;
      animation: glowSpin 3s linear infinite;
    }
    @keyframes glowSpin {
      to { --card-glow-angle: 360deg; }
    }

    /* ===== Expert Enhancement: Glass with saturate ===== */
    .header, .sidebar, .stat-card, .panel {
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    }

    /* ===== Expert Enhancement: Subtle noise texture overlay ===== */
    .sidebar::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* Scanline effect on sidebar */
    .sidebar {
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(77,171,247,0.015) 2px,
          rgba(77,171,247,0.015) 4px
        ),
        rgba(8,16,35,0.7);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .header .logo-area { width: auto; }
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .content-cols { grid-template-columns: 1fr; }
      .content { padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  const mockStats = {
    totalUsers: 12846, totalOrders: 3892,
    monthlyRevenue: 286500, dailyVisits: 7843,
    usersChange: { val: 12.5, up: true },
    ordersChange: { val: 8.3, up: true },
    revenueChange: { val: 3.2, up: false },
    visitsChange: { val: 22.1, up: true },
  };

  const chartData = [
    { label: '周一', value: 120 }, { label: '周二', value: 200 },
    { label: '周三', value: 150 }, { label: '周四', value: 280 },
    { label: '周五', value: 230 }, { label: '周六', value: 180 },
    { label: '周日', value: 310 },
  ];

  const orders = [
    { id: '#10001', user: '张明远', product: '如意云平台 · 企业版', amount: 29800, status: '已完成', time: '07-14 14:30' },
    { id: '#10002', user: '李青岚', product: '数据中台 · 专业版',   amount: 15800, status: '处理中', time: '07-14 13:15' },
    { id: '#10003', user: '王砚秋', product: 'API 网关 · 标准版',   amount: 6800,  status: '已完成', time: '07-14 11:42' },
    { id: '#10004', user: '赵寒江', product: '如意云平台 · 旗舰版', amount: 49800, status: '已完成', time: '07-14 10:08' },
    { id: '#10005', user: '陈竹韵', product: '智能分析 · 专业版',   amount: 12800, status: '待审核', time: '07-14 09:20' },
  ];

  const quickActions = [
    { label: '新建订单', icon: '📝' },
    { label: '添加用户', icon: '👤' },
    { label: '数据报表', icon: '📊' },
    { label: '系统设置', icon: '⚙️' },
  ];

  const menuGroups = [
    { group: '核心功能', items: [
      { label: '工作台', icon: '🏠' },
      { label: '数据分析', icon: '📈' },
      { label: '订单管理', icon: '📋' },
    ]},
    { group: '系统管理', items: [
      { label: '用户管理', icon: '👥' },
      { label: '角色权限', icon: '🔐' },
      { label: '系统设置', icon: '⚙️' },
    ]},
    { group: '其他', items: [
      { label: '操作日志', icon: '📜' },
      { label: '消息中心', icon: '🔔' },
    ]},
  ];

  const announcements = [
    { dot: 'blue', text: '系统已升级至 v3.2.0，新增智能分析模块' },
    { dot: 'gold', text: '7月20日将进行例行维护，请提前做好准备' },
    { dot: 'green', text: '新用户注册享7天免费试用，活动持续至月底' },
  ];

  // =================== Components ===================

  function Header() {
    return (
      <header className="header">
        <div className="logo-area">
          <div className="logo-icon">如</div>
          <span className="logo-text">如意 · 后台管理</span>
        </div>
        <div className="header-right">
          <span style={{color:'var(--text-secondary)',fontSize:14,cursor:'pointer'}}>🔔</span>
          <span style={{color:'var(--text-muted)',fontSize:12}}>2026-07-14 周二</span>
          <div className="user-avatar">管</div>
          <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>管理员</span>
        </div>
      </header>
    );
  }

  function Sidebar() {
    const [active, setActive] = useState('工作台');
    return (
      <aside className="sidebar">
        {menuGroups.map((g, gi) => (
          <div key={gi}>
            <div className="menu-group-title">{g.group}</div>
            {g.items.map((item, ii) => (
              <div
                key={ii}
                className={`menu-item${active === item.label ? ' active' : ''}`}
                onClick={() => setActive(item.label)}
              >
                <span className="menu-icon">{item.icon}</span>
                <span>{item.label}</span>
              </div>
            ))}
          </div>
        ))}
      </aside>
    );
  }

  function StatCard({ label, value, change, icon, iconClass }) {
    return (
      <div className="stat-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div className="stat-label">{label}</div>
            <div className="stat-value">{value.toLocaleString()}</div>
          </div>
          <div className={`stat-icon-wrap ${iconClass}`}>{icon}</div>
        </div>
        <div className={`stat-change ${change.up ? 'up' : 'down'}`}>
          {change.up ? '↑' : '↓'} {change.val}%
          <span style={{color:'var(--text-muted)',marginLeft:4}}>较上周</span>
        </div>
      </div>
    );
  }

  function ChartBars({ data }) {
    const maxVal = Math.max(...data.map(d => d.value));
    return (
      <div className="chart-bars">
        {data.map((d, i) => (
          <div key={i} className="chart-bar-wrap">
            <div className="chart-bar-outer" style={{height:160}}>
              <div className="chart-bar-inner" style={{height: `${(d.value / maxVal) * 140}px`}}></div>
            </div>
            <span className="chart-bar-label">{d.label}</span>
          </div>
        ))}
      </div>
    );
  }

  function OrderTable({ orders }) {
    const badgeClass = (s) => {
      if (s === '已完成') return 'success';
      if (s === '处理中') return 'info';
      return 'warning';
    };
    return (
      <table className="dash-table">
        <thead>
          <tr><th>订单号</th><th>客户</th><th>产品</th><th>金额</th><th>状态</th><th>时间</th></tr>
        </thead>
        <tbody>
          {orders.map((o, i) => (
            <tr key={i}>
              <td className="order-id">{o.id}</td>
              <td>{o.user}</td>
              <td>{o.product}</td>
              <td style={{fontWeight:600}}>¥{o.amount.toLocaleString()}</td>
              <td><span className={`badge ${badgeClass(o.status)}`}>{o.status}</span></td>
              <td style={{color:'var(--text-muted)'}}>{o.time}</td>
            </tr>
          ))}
        </tbody>
      </table>
    );
  }

  function Dashboard() {
    return (
      <div>
        <div className="page-title">👋 欢迎回来，管理员</div>
        <div className="page-subtitle">万事如意 · 今日系统运行一切正常</div>

        <div className="stat-cards">
          <StatCard label="用户总数"   value={mockStats.totalUsers}     change={mockStats.usersChange}   icon="👥" iconClass="blue" />
          <StatCard label="订单总量"   value={mockStats.totalOrders}    change={mockStats.ordersChange}  icon="📦" iconClass="gold" />
          <StatCard label="本月营收"   value={mockStats.monthlyRevenue} change={mockStats.revenueChange} icon="💰" iconClass="cyan" />
          <StatCard label="今日访问"   value={mockStats.dailyVisits}    change={mockStats.visitsChange}  icon="📈" iconClass="purple" />
        </div>

        <div className="content-cols">
          <div style={{display:'flex',flexDirection:'column',gap:24}}>
            <div className="panel">
              <h3>📊 本周访问趋势</h3>
              <ChartBars data={chartData} />
            </div>
            <div className="panel">
              <h3>📋 最近订单</h3>
              <OrderTable orders={orders} />
            </div>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:24}}>
            <div className="panel">
              <h3>⚡ 快速操作</h3>
              <div className="quick-actions">
                {quickActions.map((a, i) => (
                  <div key={i} className="qa-btn">
                    <span style={{fontSize:18}}>{a.icon}</span>
                    <span>{a.label}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="panel">
              <h3>📌 系统公告</h3>
              <div style={{fontSize:13,color:'var(--text-secondary)',lineHeight:2.2}}>
                {announcements.map((a, i) => (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
                    <span className={`dot ${a.dot}`}></span>
                    <span>{a.text}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    return (
      <div className="layout">
        {/* Animated background */}
        <div className="bg-layer">
          <div className="bg-grid"></div>
          <div className="bg-orb orb1"></div>
          <div className="bg-orb orb2"></div>
          <div className="bg-orb orb3"></div>
        </div>
        <Header />
        <div className="body">
          <Sidebar />
          <main className="content">
            <Dashboard />
          </main>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  /* ===== 3D Mouse Tilt on Stat Cards ===== */
  document.querySelectorAll('.stat-card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -8;
      const rotateY = ((x - centerX) / centerX) * 8;
      card.style.transform = 'perspective(600px) rotateX('+rotateX+'deg) rotateY('+rotateY+'deg) translateY(-4px)';
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) translateY(0px)';
      card.style.transition = 'transform 0.6s cubic-bezier(0.16,1,0.3,1)';
    });
    card.addEventListener('mouseenter', () => {
      card.style.transition = 'transform 0.1s linear';
    });
  });

  /* Add glow-animated class to stat cards */
  document.querySelectorAll('.stat-card').forEach(c => c.classList.add('glow-animated'));
</script>


</body>
</html>
