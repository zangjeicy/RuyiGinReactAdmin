<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>如意 · 后台管理系统</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ========== 如意国风科技蓝 · 全局主题 ========== */
    :root {
      --ruyi-deep:    #0B1D3A;
      --ruyi-blue:    #0F2B54;
      --ruyi-tech:    #228BE6;
      --ruyi-gold:    #C9A96E;
      --ruyi-gold-lt: #E8D5A3;
      --ruyi-bg:      #F0F3F8;
      --ruyi-white:   #FFFFFF;
      --ruyi-text:    #1E293B;
      --ruyi-text-lt: #64748B;
      --ruyi-border:  #E2E8F0;
      --ruyi-shadow:  0 2px 12px rgba(11, 29, 58, 0.06);
      --header-h: 60px;
      --sidebar-w: 220px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--ruyi-text);
      background: var(--ruyi-bg);
    }

    /* ========== Layout ========== */
    .ruyi-layout { display: flex; width: 100vw; height: 100vh; flex-direction: column; }

    /* Header */
    .ruyi-header {
      height: var(--header-h); min-height: var(--header-h); width: 100%;
      display: flex; align-items: center;
      background: var(--ruyi-white);
      border-bottom: 1px solid var(--ruyi-border);
      box-shadow: 0 1px 4px rgba(11,29,58,0.04);
      z-index: 100; padding: 0 24px; position: relative;
    }
    .ruyi-header::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--ruyi-gold) 20%, var(--ruyi-tech) 50%, var(--ruyi-gold) 80%, transparent 100%);
    }
    .ruyi-header .logo-area { display: flex; align-items: center; gap: 10px; width: var(--sidebar-w); flex-shrink: 0; }
    .ruyi-header .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--ruyi-tech), var(--ruyi-deep));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 16px;
    }
    .ruyi-header .logo-text {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--ruyi-deep), var(--ruyi-tech));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .ruyi-header .header-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
    .ruyi-header .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--ruyi-gold), var(--ruyi-gold-lt));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; font-size: 14px;
    }

    /* Body */
    .ruyi-body { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar */
    .ruyi-sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100%;
      background: linear-gradient(180deg, var(--ruyi-deep) 0%, #0A1628 100%);
      display: flex; flex-direction: column; padding: 12px 0; overflow-y: auto;
    }
    .ruyi-sidebar .menu-group-title {
      color: rgba(255,255,255,0.35); font-size: 11px;
      padding: 16px 20px 6px; letter-spacing: 2px; text-transform: uppercase;
    }
    .ruyi-sidebar .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; margin: 2px 8px;
      color: rgba(255,255,255,0.7); font-size: 14px;
      border-radius: 6px; cursor: pointer;
      transition: all 0.2s; border: none; background: none;
    }
    .ruyi-sidebar .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .ruyi-sidebar .menu-item.active {
      color: var(--ruyi-gold); background: rgba(201,169,110,0.12); font-weight: 600;
    }
    .ruyi-sidebar .menu-icon { font-size: 18px; width: 24px; text-align: center; }

    /* Content */
    .ruyi-content { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--ruyi-bg); padding: 24px; }
    .ruyi-content::-webkit-scrollbar { width: 6px; }
    .ruyi-content::-webkit-scrollbar-track { background: transparent; }
    .ruyi-content::-webkit-scrollbar-thumb { background: rgba(11,29,58,0.15); border-radius: 3px; }

    /* Page title */
    .page-title { font-size: 22px; font-weight: 700; color: var(--ruyi-deep); margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: var(--ruyi-text-lt); margin-bottom: 24px; }

    /* Stat cards */
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card {
      background: var(--ruyi-white); border-radius: 12px;
      padding: 20px 24px; box-shadow: var(--ruyi-shadow);
      display: flex; flex-direction: column; gap: 8px;
      border: 1px solid var(--ruyi-border);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(11,29,58,0.1); }
    .stat-card .stat-label { font-size: 13px; color: var(--ruyi-text-lt); }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--ruyi-deep); }
    .stat-card .stat-change { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .stat-card .stat-change.up { color: #10B981; }
    .stat-card .stat-change.down { color: #EF4444; }
    .stat-icon-wrap { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
    .stat-icon-wrap.blue   { background: linear-gradient(135deg, #228BE6, #1C7ED6); }
    .stat-icon-wrap.gold   { background: linear-gradient(135deg, #D4A853, #C9A96E); }
    .stat-icon-wrap.green  { background: linear-gradient(135deg, #10B981, #059669); }
    .stat-icon-wrap.purple { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }

    /* Content columns */
    .content-cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }

    /* Panel */
    .panel {
      background: var(--ruyi-white); border-radius: 12px;
      padding: 24px; box-shadow: var(--ruyi-shadow);
      border: 1px solid var(--ruyi-border);
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 4px; height: 40px;
      background: linear-gradient(180deg, var(--ruyi-gold), var(--ruyi-tech));
      border-radius: 0 4px 4px 0;
    }
    .panel h3 { font-size: 16px; font-weight: 600; color: var(--ruyi-deep); margin-bottom: 16px; padding-bottom: 12px; padding-left: 12px; border-bottom: 1px solid var(--ruyi-border); }

    /* Chart bars */
    .chart-bars { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 8px; }
    .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .chart-bar {
      width: 100%; max-width: 40px; border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, var(--ruyi-tech), var(--ruyi-deep));
      transition: height 0.5s ease; min-height: 4px;
    }
    .chart-bar-label { font-size: 11px; color: var(--ruyi-text-lt); }

    /* Table */
    .ruyi-table { width: 100%; border-collapse: collapse; }
    .ruyi-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ruyi-text-lt); padding: 10px 12px; border-bottom: 2px solid var(--ruyi-border); }
    .ruyi-table td { font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--ruyi-border); color: var(--ruyi-text); }
    .ruyi-table tr:hover td { background: rgba(34,139,230,0.03); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge.success { background: #D1FAE5; color: #065F46; }
    .badge.warning { background: #FEF3C7; color: #92400E; }
    .badge.info    { background: #DBEAFE; color: #1E40AF; }

    /* Quick actions */
    .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .quick-action-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px; border-radius: 10px; border: 1px solid var(--ruyi-border);
      background: var(--ruyi-white); cursor: pointer; font-size: 13px; color: var(--ruyi-text);
      transition: all 0.2s;
    }
    .quick-action-btn:hover { border-color: var(--ruyi-tech); background: rgba(34,139,230,0.04); color: var(--ruyi-tech); }

    /* Responsive */
    @media (max-width: 768px) {
      .ruyi-sidebar { display: none; }
      .ruyi-header .logo-area { width: auto; }
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .content-cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  // ==================== Mock Data ====================
  const mockStats = {
    totalUsers:     12846,
    totalOrders:    3892,
    monthlyRevenue: 286500,
    dailyVisits:    7843,
    usersChange:    { val: 12.5, up: true },
    ordersChange:   { val: 8.3,  up: true },
    revenueChange:  { val: 3.2,  up: false },
    visitsChange:   { val: 22.1, up: true },
  };

  const mockChartData = [
    { label: '周一', value: 120 },
    { label: '周二', value: 200 },
    { label: '周三', value: 150 },
    { label: '周四', value: 280 },
    { label: '周五', value: 230 },
    { label: '周六', value: 180 },
    { label: '周日', value: 310 },
  ];

  const mockOrders = [
    { id: '#10001', user: '张明远', product: '如意云平台 · 企业版', amount: 29800, status: '已完成', time: '07-14 14:30' },
    { id: '#10002', user: '李青岚', product: '数据中台 · 专业版',   amount: 15800, status: '处理中', time: '07-14 13:15' },
    { id: '#10003', user: '王砚秋', product: 'API 网关 · 标准版',   amount: 6800,  status: '已完成', time: '07-14 11:42' },
    { id: '#10004', user: '赵寒江', product: '如意云平台 · 旗舰版', amount: 49800, status: '已完成', time: '07-14 10:08' },
    { id: '#10005', user: '陈竹韵', product: '智能分析 · 专业版',   amount: 12800, status: '待审核', time: '07-14 09:20' },
  ];

  const quickActions = [
    { label: '新建订单', icon: '📝' },
    { label: '添加用户', icon: '👤' },
    { label: '数据报表', icon: '📊' },
    { label: '系统设置', icon: '⚙️' },
  ];

  const menuItems = [
    { group: '核心功能', items: [
      { label: '工作台',   icon: '🏠' },
      { label: '数据分析', icon: '📈' },
      { label: '订单管理', icon: '📋' },
    ]},
    { group: '系统管理', items: [
      { label: '用户管理', icon: '👥' },
      { label: '角色权限', icon: '🔐' },
      { label: '系统设置', icon: '⚙️' },
    ]},
    { group: '其他', items: [
      { label: '操作日志', icon: '📜' },
      { label: '消息中心', icon: '🔔' },
    ]},
  ];

  // ==================== Components ====================

  function Header() {
    return (
      <header className="ruyi-header">
        <div className="logo-area">
          <div className="logo-icon">如</div>
          <span className="logo-text">如意 · 后台管理</span>
        </div>
        <div className="header-right">
          <span style={{fontSize:13, color:'var(--ruyi-text-lt)'}}>🔔</span>
          <span style={{fontSize:13, color:'var(--ruyi-text-lt)'}}>2026-07-14 周二</span>
          <div className="user-avatar">管</div>
          <span style={{fontSize:13, fontWeight:600, color:'var(--ruyi-deep)'}}>管理员</span>
        </div>
      </header>
    );
  }

  function Sidebar() {
    const [active, setActive] = useState('工作台');
    return (
      <aside className="ruyi-sidebar">
        {menuItems.map((group, gi) => (
          <div key={gi}>
            <div className="menu-group-title">{group.group}</div>
            {group.items.map((item, ii) => (
              <div
                key={ii}
                className={`menu-item${active === item.label ? ' active' : ''}`}
                onClick={() => setActive(item.label)}
              >
                <span className="menu-icon">{item.icon}</span>
                <span>{item.label}</span>
              </div>
            ))}
          </div>
        ))}
      </aside>
    );
  }

  function StatCard({ label, value, change, icon, iconClass }) {
    return (
      <div className="stat-card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
          <div>
            <div className="stat-label">{label}</div>
            <div className="stat-value">{value.toLocaleString()}</div>
          </div>
          <div className={`stat-icon-wrap ${iconClass}`}>{icon}</div>
        </div>
        <div className={`stat-change ${change.up ? 'up' : 'down'}`}>
          {change.up ? '\u2191' : '\u2193'} {change.val}%
          <span style={{color:'var(--ruyi-text-lt)', marginLeft:4}}>较上周</span>
        </div>
      </div>
    );
  }

  function ChartBars({ data }) {
    const maxVal = Math.max(...data.map(d => d.value));
    return (
      <div className="chart-bars">
        {data.map((d, i) => (
          <div key={i} className="chart-bar-wrap">
            <div className="chart-bar" style={{height: `${(d.value / maxVal) * 140}px`}}></div>
            <span className="chart-bar-label">{d.label}</span>
          </div>
        ))}
      </div>
    );
  }

  function OrderTable({ orders }) {
    const statusBadge = (s) => {
      if (s === '已完成') return 'success';
      if (s === '处理中') return 'info';
      return 'warning';
    };
    return (
      <table className="ruyi-table">
        <thead>
          <tr><th>订单号</th><th>客户</th><th>产品</th><th>金额</th><th>状态</th><th>时间</th></tr>
        </thead>
        <tbody>
          {orders.map((o, i) => (
            <tr key={i}>
              <td style={{color:'var(--ruyi-tech)', fontWeight:500}}>{o.id}</td>
              <td>{o.user}</td>
              <td>{o.product}</td>
              <td style={{fontWeight:600}}>¥{o.amount.toLocaleString()}</td>
              <td><span className={`badge ${statusBadge(o.status)}`}>{o.status}</span></td>
              <td style={{color:'var(--ruyi-text-lt)'}}>{o.time}</td>
            </tr>
          ))}
        </tbody>
      </table>
    );
  }

  function Dashboard() {
    return (
      <div>
        <div className="page-title">👋 欢迎回来，管理员</div>
        <div className="page-subtitle">万事如意 · 今日系统运行一切正常</div>

        <div className="stat-cards">
          <StatCard label="用户总数"   value={mockStats.totalUsers}     change={mockStats.usersChange}   icon="👥" iconClass="blue" />
          <StatCard label="订单总量"   value={mockStats.totalOrders}    change={mockStats.ordersChange}  icon="📦" iconClass="gold" />
          <StatCard label="本月营收"   value={mockStats.monthlyRevenue} change={mockStats.revenueChange} icon="💰" iconClass="green" />
          <StatCard label="今日访问"   value={mockStats.dailyVisits}    change={mockStats.visitsChange}  icon="📈" iconClass="purple" />
        </div>

        <div className="content-cols">
          <div style={{display:'flex', flexDirection:'column', gap:24}}>
            <div className="panel">
              <h3>📊 本周访问趋势</h3>
              <ChartBars data={mockChartData} />
            </div>
            <div className="panel">
              <h3>📋 最近订单</h3>
              <OrderTable orders={mockOrders} />
            </div>
          </div>

          <div style={{display:'flex', flexDirection:'column', gap:24}}>
            <div className="panel">
              <h3>⚡ 快速操作</h3>
              <div className="quick-actions">
                {quickActions.map((a, i) => (
                  <div key={i} className="quick-action-btn">
                    <span style={{fontSize:18}}>{a.icon}</span>
                    <span>{a.label}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="panel">
              <h3>📌 系统公告</h3>
              <div style={{fontSize:13, color:'var(--ruyi-text-lt)', lineHeight:2}}>
                <div style={{display:'flex', gap:8, marginBottom:8}}>
                  <span style={{color:'var(--ruyi-tech)'}}>●</span>
                  <span>系统已升级至 v3.2.0，新增智能分析模块</span>
                </div>
                <div style={{display:'flex', gap:8, marginBottom:8}}>
                  <span style={{color:'var(--ruyi-gold)'}}>●</span>
                  <span>7月20日将进行例行维护，请提前做好准备</span>
                </div>
                <div style={{display:'flex', gap:8}}>
                  <span style={{color:'#10B981'}}>●</span>
                  <span>新用户注册享7天免费试用，活动持续至月底</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    return (
      <div className="ruyi-layout">
        <Header />
        <div className="ruyi-body">
          <Sidebar />
          <main className="ruyi-content">
            <Dashboard />
          </main>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
